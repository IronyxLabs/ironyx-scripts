name: pnpm.install
description: Allows install dependencies via pnpm

inputs:
  working-directory:
    description: Working directory 
    required: true

outputs:
  cache_key:
    description: Generated cache key
    value: ${{ steps.generate-cache-key.outputs.CACHE_KEY }}

runs:
  using: composite
  steps:
    - name: Install Dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}