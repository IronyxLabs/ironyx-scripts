name: dotnet.test
description: Allows to test a built dotnet project

inputs:
  solution:
    description: Solution name
    required: true

runs:
  using: composite
  steps:


    - name: Execute Tests
      run: dotnet test ${{ inputs.solution }} --artifacts-path ${{ github.workspace}}/artifacts --logger "trx;LogFileName=test-results.trx" --results-directory results --collect:"XPlat Code Coverage" --no-restore --no-build --configuration Release --runtime linux-x64
      shell: bash
      continue-on-error: true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: test_results_${{ github.run_id }}
        path: ${{ github.workspace }}/results
        retention-days: 1
