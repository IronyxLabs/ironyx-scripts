name: dotnet.nuget.pack
description: Packing NuGet package.

inputs:
  solution:
    description: Solution name
    required: true

runs:
  using: composite
  steps:
    - name: Packing NuGet Packages
      run: dotnet pack --artifacts-path ${{ github.workspace}}/artifacts --output ${{ github.workspace}}/artifacts -p:Version=${GITHUB_REF_NAME#v} ${{ inputs.solution }}
      shell: bash
