name: Sample NuGet CI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

run-name: format('[TAG] - Build version: {0}', github.ref_name#v)

jobs:
  ci:
    uses: IronyxLabs/ironyx-scripts/.github/workflows/dotnet_nuget_ci-pipeline.yaml@feature/6-create-nuget-release-pipeline
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
      testspace-token: ${{ secrets.TESTSPACE_TOKEN }}
    with:
      sonar-project_key: IronyxLabs_ironyx-scripts
      net-solution: src/Sample.slnx
